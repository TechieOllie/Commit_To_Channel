[project]
name = "commit-to-channel"
version = "0.1.0"
description = "Discord bot that syncs Markdown files (git or Nextcloud) to a Discord channel"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.6",
    "requests>=2.31",
]

# No [build-system]: uv treats this as an application, installing only the
# dependencies; the code runs from the checkout with `python -m bot`.

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "ASYNC"]
